name: Release Obsidian plugin

on:
    push:
        tags:
            - '[0-9]*'

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
              with:
                  version: 11.25.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Verify tag matches version files
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  if [[ "$tag" == v* ]]; then
                    echo "Tag '$tag' must not have a 'v' prefix." >&2
                    echo "Obsidian community directory validation requires the tag to match the manifest version exactly." >&2
                    echo "Example: use '1.0.0', not 'v1.0.0'." >&2
                    exit 1
                  fi

                  if ! [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                    echo "Tag must be MAJOR.MINOR.PATCH with optional SemVer metadata" >&2
                    exit 1
                  fi

                  pkg=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
                  mfst=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
                  min_app=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).minAppVersion")
                  version_entry=$(node -p "JSON.parse(require('fs').readFileSync('versions.json'))[process.argv[1]] || ''" "$pkg")

                  if [[ "$pkg" != "$tag" ]]; then
                    echo "package.json version ($pkg) does not match tag ($tag)" >&2
                    exit 1
                  fi

                  if [[ "$mfst" != "$tag" ]]; then
                    echo "manifest.json version ($mfst) does not match tag ($tag)" >&2
                    exit 1
                  fi

                  if [[ -z "$version_entry" ]]; then
                    echo "versions.json has no entry for $tag" >&2
                    exit 1
                  fi

                  if [[ "$version_entry" != "$min_app" ]]; then
                    echo "versions.json entry ($version_entry) does not match manifest minAppVersion ($min_app)" >&2
                    exit 1
                  fi

    build:
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
              with:
                  version: 11.25.0

            - name: Use Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Quality gate
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build
                  pnpm run lint
                  pnpm run test

            - name: Attest build provenance
              uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
              with:
                  draft: false
                  files: |
                      main.js
                      manifest.json
                      styles.css
